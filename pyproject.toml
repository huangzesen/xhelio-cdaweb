[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xhelio-cdaweb"
version = "0.3.3"
description = "NASA CDAWeb data access for heliophysics — browse observatories, inspect parameters, fetch CDF data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Zesen Huang" },
]
keywords = ["cdaweb", "nasa", "heliophysics", "space-weather", "mcp", "cdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "cdflib>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/huangzesen/xhelio-cdaweb"
Repository = "https://github.com/huangzesen/xhelio-cdaweb"

[project.optional-dependencies]
mcp = ["mcp>=1.26.0"]
dev = [
    "pytest>=7.0",
    "mcp>=1.26.0",
]

[project.scripts]
xhelio-cdaweb-mcp = "cdawebmcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cdawebmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
